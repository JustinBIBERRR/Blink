name: build-macos

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test reminder, system and storage behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Test native input callbacks in isolation
        run: cargo test --manifest-path src-tauri/Cargo.toml native_ --lib -- --ignored --test-threads=1

      - name: Typecheck and build frontend
        run: npm run build

      - name: Build unsigned Tauri app and disk image
        run: npm run tauri build -- --bundles app dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blink-macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
